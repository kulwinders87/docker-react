name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t kulwinders/docker-react -f Dockerfile.dev .

      - name: Run tests
        run: docker run -e CI=true kulwinders/docker-react npm run test -- --coverage
