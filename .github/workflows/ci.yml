name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t kulwinders/docker-react -f Dockerfile.dev .

      - name: Run tests
        run: docker run -e CI=true kulwinders/docker-react npm run test -- --coverage

      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*' -x 'node_modules/*' -x 'docker-compose.yml'

      - name: Verify zip contents
        run: unzip -l deploy.zip | grep -E 'Dockerfile|docker'

      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: docker-react
          environment_name: docker-react-env
          existing_bucket_name: elasticbeanstalk-ap-southeast-2-802528390710
          region: ap-southeast-2
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip